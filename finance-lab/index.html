<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="自動運転モビリティ事業の事業収支（P/L・FCF・IRR・NPV）を、Federationの指数とシミュレータと同じ計算エンジンで試算するページ。">
<title>事業収支ラボ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&family=Zen+Kaku+Gothic+Antique:wght@700;900&display=swap">
<style>
/* Layout: an operator's console. KPI strip on top, levers (tornado + cash flow) on the left, the scenario desk on the right. */
:root {
  --bg: #f3f5f7; --panel: #ffffff; --line: #d9dfe6; --ink: #13202f; --muted: #5a6778;
  --accent: #1d5f86; --accent-soft: #e3eef5; --pos: #1f7a4d; --neg: #b42318; --warn: #a15c00; --bar-base: #c3ccd6;
  --f-display: "Zen Kaku Gothic Antique", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --f-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1620; --panel: #16202c; --line: #2a3747; --ink: #e6edf4; --muted: #9aa8b8;
  --accent: #6db3dd; --accent-soft: #1b3346; --pos: #5cc28f; --neg: #f07a6c; --warn: #e0a54a; --bar-base: #3a4a5c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1620; --panel: #16202c; --line: #2a3747; --ink: #e6edf4; --muted: #9aa8b8;
  --accent: #6db3dd; --accent-soft: #1b3346; --pos: #5cc28f; --neg: #f07a6c; --warn: #e0a54a; --bar-base: #3a4a5c; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px }
h1 { font-family: var(--f-display); font-weight: 900; font-size: 1.75rem; letter-spacing: .02em; margin: 0; text-wrap: balance }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; margin: 0; text-wrap: balance }
.eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: .82rem }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px }
header.top .meta { font-size: .78rem; color: var(--muted) }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.kpi { background: var(--panel); padding: 12px 14px; display: grid; gap: 2px; min-width: 0 }
.kpi .label { font-size: .78rem; color: var(--muted) }
.kpi .value { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 1.45rem; font-weight: 600; line-height: 1.2 }
.kpi .value small { font-family: var(--f-body); font-size: .75rem; font-weight: 400; color: var(--muted); margin-left: 3px }
.kpi .delta { font-family: var(--f-num); font-size: .78rem; min-height: 1.2em }
.neg { color: var(--neg) } .pos { color: var(--pos) }
.grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start }
.col { display: grid; gap: 18px; min-width: 0 }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0 }
.panel-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .8rem; padding: 4px 12px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel) }
button, input, textarea { font: inherit; color: inherit }
button:focus-visible, input:focus-visible, textarea:focus-visible, .tbar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--panel); border-radius: var(--r); padding: 6px 14px; cursor: pointer; font-size: .85rem }
.btn.ghost { background: transparent; color: var(--accent) }
.btn:disabled { opacity: .5; cursor: default }
/* Tornado */
.tornado { display: grid; gap: 4px }
.trow { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 10px; align-items: center }
.trow .name { font-size: .78rem; line-height: 1.3; overflow-wrap: anywhere }
.trow .name .id { display: block; color: var(--muted); font-family: var(--f-num); font-size: .68rem }
.track { position: relative; height: 22px }
.track .axis { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: .5 }
.tbar { position: absolute; top: 3px; height: 16px; border: 0; padding: 0; cursor: pointer; border-radius: 2px }
.tbar.lo { background: var(--neg); opacity: .78 } .tbar.hi { background: var(--pos); opacity: .78 }
.tbar:hover { opacity: 1 }
.tbar span { position: absolute; top: -1px; font-family: var(--f-num); font-size: .68rem; white-space: nowrap; color: var(--ink) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .75rem; color: var(--muted) }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px }
/* Cash flow chart */
.chart { overflow-x: auto }
.chart svg { display: block; width: 100%; min-width: 460px; height: auto }
/* Scenario desk */
.ov-list { display: grid; gap: 6px }
.ov { display: grid; grid-template-columns: minmax(0, 1fr) 7.5rem auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r) }
.ov .lbl { font-size: .8rem; line-height: 1.3; min-width: 0; overflow-wrap: anywhere }
.ov .lbl .sub { display: block; color: var(--muted); font-size: .7rem; font-family: var(--f-num) }
.tag { display: inline-block; font-size: .66rem; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 1px }
.ov input { width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); font-family: var(--f-num); text-align: right }
.x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 2px 6px }
.add { display: flex; gap: 8px }
.add input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg) }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 12px; font-size: .82rem; color: var(--muted) }
/* Ask Claude */
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: .78rem; cursor: pointer; color: var(--ink) }
.ask textarea { width: 100%; min-height: 64px; resize: vertical; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg) }
.thread { display: grid; gap: 10px; max-height: 420px; overflow-y: auto }
.msg { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .86rem; padding: 10px 12px; border-radius: var(--r) }
.msg.user { background: var(--accent-soft) }
.msg.ai { border: 1px solid var(--line) }
.msg .act { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap }
.status { font-size: .78rem; color: var(--muted) }
/* Saved scenarios */
.saved { display: grid; gap: 6px }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r) }
.srow .nm { font-weight: 500; overflow-wrap: anywhere }
.srow .kv { font-family: var(--f-num); font-size: .74rem; color: var(--muted) }
.save { display: flex; gap: 8px }
.save input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg) }
footer { font-size: .75rem; color: var(--muted); max-width: 70ch }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr) } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) } .kpi:last-child { grid-column: span 2 } }
@media (max-width: 480px) { .trow { grid-template-columns: minmax(0, 1fr) } .ov { grid-template-columns: minmax(0, 1fr) 6rem auto } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
.top-right { display: grid; gap: 6px; justify-items: end }
@media (max-width: 640px) { .top-right { justify-items: start } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Mobility Business Lab · Project finance</div>
      <h1 data-i18n="title">事業収支ラボ</h1>
    </div>
    <div class="top-right">
      <div class="seg" role="group" aria-label="Language / 言語">
        <button type="button" id="lang-ja" aria-pressed="true" lang="ja">日本語</button>
        <button type="button" id="lang-en" aria-pressed="false" lang="en">English</button>
      </div>
      <div class="meta" id="meta"></div>
    </div>
  </header>

  <div class="kpis" id="kpis" aria-live="polite"></div>

  <div class="grid">
    <div class="col">
      <section class="panel" aria-labelledby="h-tornado">
        <div class="panel-head">
          <h2 id="h-tornado" data-i18n="tornadoTitle">効く前提の順位</h2>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <div class="seg" role="group" data-i18n-aria="metricGroup" aria-label="指標">
              <button type="button" id="m-op35" aria-pressed="true" data-i18n="op35">2035年 営業利益</button>
              <button type="button" id="m-npv" aria-pressed="false" data-i18n="npvShort">NPV（8%）</button>
            </div>
            <div class="seg" role="group" data-i18n-aria="swingGroup" aria-label="振れ幅">
              <button type="button" id="s-10" aria-pressed="false">±10%</button>
              <button type="button" id="s-20" aria-pressed="true">±20%</button>
            </div>
          </div>
        </div>
        <p class="small muted" style="margin:0" data-i18n="tornadoLead">Federationの指数を1つずつ動かし、指標がどれだけ変わるかを大きい順に並べています。バーを押すと、その値を仮入力として右のシナリオに入れます。</p>
        <div class="legend"><span><i class="sw" style="background:var(--neg)"></i><span data-i18n="legendLow">前提を下げたとき</span></span><span><i class="sw" style="background:var(--pos)"></i><span data-i18n="legendHigh">前提を上げたとき</span></span><span id="t-note"></span></div>
        <div class="tornado" id="tornado"><div class="empty" data-i18n="computing">計算しています…</div></div>
      </section>

      <section class="panel" aria-labelledby="h-cf">
        <div class="panel-head">
          <h2 id="h-cf" data-i18n="cfTitle">フリーキャッシュフロー 2025–2035</h2>
          <div class="legend"><span><i class="sw" style="background:var(--accent)"></i><span data-i18n="cfScenario">シナリオ（年次）</span></span><span><i class="sw" style="background:var(--bar-base)"></i><span data-i18n="cfPlan">計画値（年次）</span></span><span><i class="sw" style="background:var(--warn)"></i><span data-i18n="cfCum">シナリオ累計</span></span></div>
        </div>
        <div class="chart" id="chart"></div>
        <p class="small muted" style="margin:0" id="cf-note"></p>
      </section>
    </div>

    <div class="col">
      <section class="panel" aria-labelledby="h-scn">
        <div class="panel-head"><h2 id="h-scn" data-i18n="scenarioTitle">シナリオ</h2><button type="button" class="btn ghost" id="reset" data-i18n="reset">計画値に戻す</button></div>
        <div class="ov-list" id="ovs"></div>
        <div class="add">
          <input id="add-input" list="add-list" data-i18n-ph="addPh" placeholder="指数を名前かIDで探す（例: fare, hpc price）" data-i18n-aria="addAria" aria-label="追加する指数">
          <datalist id="add-list"></datalist>
          <button type="button" class="btn" id="add-btn" data-i18n="add">追加</button>
        </div>
      </section>

    </div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const FinanceEngine = (() => {
// Itemization (明細化) definitions. A P/L line can be split into component indices without changing the
// aggregation level of the P/L: the line is the sum (kind 'lump', B JPY per year) or the driver times the sum
// (kind 'unit', per vehicle-year) of its parts. `remainder` is the part that holds what is not itemized yet, so
// moving an amount from the remainder to a part keeps the total. Labels live in src/data/indexUpdateProposals.json.
// To itemize another line: add a definition here, add the part records to the registry, and set the total as derived.
const BREAKDOWNS = [
  { id: 'maas-ops', group: 'opex', line: 'maasOps', kind: 'unit', driver: 'vehicles', totalPrefix: 'fa-maas-ops-unit-', partPrefix: 'fa-maas-ops-',
    parts: ['remote-labour', 'maintenance-cleaning', 'insurance', 'comms-cloud', 'energy', 'vehicle-depreciation', 'other'], remainder: 'other', unit: 'M JPY/unit' },
  { id: 'remote-ops', group: 'opex', line: 'remoteOps', kind: 'lump', totalPrefix: 'fa-pf-remote-ops-', partPrefix: 'fa-pf-remote-ops-',
    parts: ['labour', 'comms-cloud', 'other'], remainder: 'other', unit: 'B JPY/year' },
  { id: 'dispatch-ops', group: 'opex', line: 'dispatchOps', kind: 'lump', totalPrefix: 'fa-pf-dispatch-ops-', partPrefix: 'fa-pf-dispatch-ops-',
    parts: ['labour', 'comms-cloud', 'other'], remainder: 'other', unit: 'B JPY/year' },
  { id: 'maintenance', group: 'sga', line: 'maintenance', kind: 'lump', totalPrefix: 'fa-pf-maintenance-', partPrefix: 'fa-pf-maintenance-',
    parts: ['labour', 'parts-materials', 'other'], remainder: 'other', unit: 'B JPY/year' },
  { id: 'platform-ops', group: 'opex', line: 'platformOps', kind: 'lump', totalPrefix: 'fa-pf-platform-ops-', partPrefix: 'fa-pf-platform-ops-',
    parts: ['labour', 'comms-cloud', 'other'], remainder: 'other', unit: 'B JPY/year' },
  { id: 'cloud-ops-base', group: 'opex', line: 'cloudOpsBase', kind: 'lump', totalPrefix: 'fa-pf-cloud-ops-base-', partPrefix: 'fa-pf-cloud-ops-base-',
    parts: ['compute-storage', 'network', 'other'], remainder: 'other', unit: 'B JPY/year' },
  { id: 'ai-ops', group: 'opex', line: 'aiOps', kind: 'lump', totalPrefix: 'fa-pf-ai-ops-', partPrefix: 'fa-pf-ai-ops-',
    parts: ['labour', 'compute', 'other'], remainder: 'other', unit: 'B JPY/year' },
  { id: 'customer-ops', group: 'sga', line: 'customerOps', kind: 'lump', totalPrefix: 'fa-pf-customer-ops-', partPrefix: 'fa-pf-customer-ops-',
    parts: ['labour', 'comms-cloud', 'other'], remainder: 'other', unit: 'B JPY/year' },
  { id: 'partner-ops', group: 'sga', line: 'partnerOps', kind: 'lump', totalPrefix: 'fa-pf-partner-ops-', partPrefix: 'fa-pf-partner-ops-',
    parts: ['labour', 'commissions', 'other'], remainder: 'other', unit: 'B JPY/year' },
  { id: 'material-cycle', group: 'opex', line: 'materialCycle', kind: 'lump', totalPrefix: 'fa-pf-material-cycle-', partPrefix: 'fa-pf-material-cycle-',
    parts: ['labour', 'materials', 'other'], remainder: 'other', unit: 'B JPY/year' },
  { id: 'node-optimization', group: 'opex', line: 'nodeOptimization', kind: 'lump', totalPrefix: 'fa-pf-node-optimization-', partPrefix: 'fa-pf-node-optimization-',
    parts: ['labour', 'comms-cloud', 'other'], remainder: 'other', unit: 'B JPY/year' },
  { id: 'energy-sync', group: 'opex', line: 'energySync', kind: 'lump', totalPrefix: 'fa-pf-energy-sync-', partPrefix: 'fa-pf-energy-sync-',
    parts: ['labour', 'comms-cloud', 'other'], remainder: 'other', unit: 'B JPY/year' },
];
const partId = (def, part, year) => `${def.partPrefix}${part}-${year}`;
const totalId = (def, year) => `${def.totalPrefix}${year}`;
const allPartIds = (def) => ['2030', '2035'].flatMap((y) => def.parts.map((k) => partId(def, k, y)));
const derivedTotalIds = () => BREAKDOWNS.flatMap((d) => ['2030', '2035'].map((y) => totalId(d, y)));
// Levers and sensitivity runs that move a total must move its parts instead (the total is their sum).
function expandIds(ids) {
  return [...new Set(ids.flatMap((id) => {
    const d = BREAKDOWNS.find((b) => ['2030', '2035'].some((y) => totalId(b, y) === id));
    if (!d) return [id];
    const y = id.slice(-4);
    return [id, ...d.parts.map((k) => partId(d, k, y))];
  }))];
}

// Project-level P&L, cash flow, IRR and NPV engine.
// Canonical calculation for the English portfolio pages 11 and 14.
// Every input is a Federation numeric baseline record (hand-updated in Federation only).
// Monetary outputs are B JPY. Pure function: no I/O, no randomness.

const PROJECT_FINANCE_ENGINE_VERSION = 'project-finance-1.1.0';
const YEARS = [2025, 2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035];
const B = 1e9;
// Publication convention: every displayed money value is rounded to 0.001 B JPY before it is used downstream.
const r3 = (x) => Math.round(x * 1000) / 1000;
const roundAll = (o) => Object.fromEntries(Object.entries(o).map(([k, x]) => [k, r3(x)]));

// Itemized lines: when every part index of a definition is present, the line is built from the parts;
// otherwise the legacy total index is used (older baselines). The P/L keeps one line per definition.
function breakdownParts(v, def, y) {
  try { return Object.fromEntries(def.parts.map((k) => [k, v(partId(def, k, y))])); } catch { return null; }
}

function indexMap(baseline) {
  const m = new Map();
  for (const r of baseline.records || []) {
    const match = String(r.value ?? '').match(/^(?:[≥≤<>]=?|=)?\s*(-?\d+(?:\.\d+)?)$/);
    if (match) m.set(r.id, Number(match[1]));
  }
  return m;
}

function reader(m, overrides = {}) {
  return (id) => {
    if (Object.prototype.hasOwnProperty.call(overrides, id)) return overrides[id];
    if (!m.has(id)) throw new Error('Missing Federation index: ' + id);
    return m.get(id);
  };
}
// Node count at the end of a year. Assumption: no node exists before 2030; 2030 and 2035 are the registered counts,
// 2031-2034 the build plan.
function nodeCount(v, year) {
  if (year < 2030) return 0;
  return year === 2030 ? v('fa-node-count-2030') : year === 2035 ? v('fa-node-count-2035') : v('fa-pf-node-count-' + year);
}
// Units acquired in a year: the count above the highest count of the earlier years. A decrease buys nothing, and a
// later rise back to an earlier level re-uses the units already held (disposals are not modelled).
function nodesAdded(v, year) {
  let high = 0;
  for (let t = 2030; t < year; t++) high = Math.max(high, nodeCount(v, t));
  return Math.max(0, nodeCount(v, year) - high);
}

function hpcYear(v, year, nodes, opt = {}) {
  const gpus = nodes * (opt.gpuPerNode ?? v('fa-pf-hpc-gpu-per-node'));
  const u = opt.utilization ?? v('fa-pf-hpc-utilization-' + year);
  const price = opt.price ?? v('fa-pf-hpc-price-' + year);
  const hours = v('fa-pf-hours-per-year');
  const revenue = (gpus * hours * u * price) / B;
  const power = (gpus * v('fa-pf-hpc-kw-per-gpu') * v('fa-pf-hpc-pue') * hours * u * v('fa-pf-hpc-electricity-price')) / B;
  const service = revenue * v('fa-pf-hpc-service-cost-rate');
  return { gpus, utilization: u, price, revenue: r3(revenue), power: r3(power), service: r3(service), ebitda: r3(revenue - power - service) };
}

// Distributed quantum computing (DQC) infrastructure: QPU modules hosted at the LH₂-cooled Nodes and sold as dedicated
// QPU-hours. Active when the fa-pf-dqc-* indices are present (the Federation registry carries the base case; the low/high
// cases are passed as overrides). Without them, or with zero modules in every year, the engine emits no DQC lines.
const DQC_YEARS = [2030, 2031, 2032, 2033, 2034, 2035];
function dqcActive(v) {
  try { return DQC_YEARS.some((y) => v('fa-pf-dqc-modules-' + y) > 0); } catch { return false; }
}
function dqcYear(v, year) {
  const y = String(year);
  const modules = v('fa-pf-dqc-modules-' + y);
  const u = v('fa-pf-dqc-utilization-' + y), price = v('fa-pf-dqc-price-' + y);
  const hours = v('fa-pf-hours-per-year');
  const revenue = (modules * hours * u * price) / B;
  // Cryogenics and control electronics run all year, not only during paid hours.
  const power = (modules * v('fa-pf-dqc-kw-per-module') * hours * v('fa-pf-hpc-electricity-price')) / B;
  const capexPerModule = (v('fa-pf-dqc-capex-per-module') * 1e6) / B;
  const maintenance = modules * capexPerModule * v('fa-pf-dqc-maintenance-rate');
  const service = revenue * v('fa-pf-dqc-service-cost-rate');
  const depreciation = (modules * capexPerModule) / v('fa-pf-dep-life-dqc');
  const prev = year > DQC_YEARS[0] ? v('fa-pf-dqc-modules-' + (year - 1)) : 0;
  const capex = Math.max(0, modules - prev) * capexPerModule;
  // The service cost covers operations, sales and customer support (as for HPC); no separate SG&A line.
  // EBITDA and operating profit are built from the published (rounded) lines, so the cash flow and the P/L agree to the yen.

  };
  let lang = (() => {

    try { const s = localStorage.getItem('finance-lab-lang'); if (s === 'en' || s === 'ja') return s; } catch {}

    return s;
  };
  const locale = () => (lang === 'ja' ? 'ja-JP' : 'en-US');
  // money(b): b in B JPY → the displayed number in this language's unit.
  const money = (b) => (lang === 'ja' ? b * 10 : b);
  const moneyDp = () => (lang === 'ja' ? 1 : 2);
  const fmtMoney = (b) => { const x = money(b); const d = moneyDp(); const r = Math.round(x * 10 ** d) / 10 ** d;

  const sgn = (b) => (b < 0 ? '−' : '+') + fmtMoney(Math.abs(b));

    $('lang-ja').setAttribute('aria-pressed', String(lang === 'ja'));
    $('lang-en').setAttribute('aria-pressed', String(lang === 'en'));
  }

  // ---------- Engine helpers (all amounts in B JPY) ----------
  const reader = (ov) => (id) => {
    if (Object.prototype.hasOwnProperty.call(ov, id)) return ov[id];
    if (!M.has(id)) throw new Error('Missing Federation index: ' + id);
    return M.get(id);
  };
  const quick = (ov) => {
    const v = reader(ov);
    const p30 = E.pnlYear(v, 2030), p35 = E.pnlYear(v, 2035);
    const cf = E.cashFlow(v, p30, p35);
    return { op30: p30.totals.operatingProfit, op35: p35.totals.operatingProfit, npv8: cf.npv8, irr: cf.irr, rows: cf.rows };
  };
  const full = (ov) => {
    const r = E.runProjectFinance(BASELINE, ov);
    return { op30: r.pnl[2030].totals.operatingProfit, op35: r.pnl[2035].totals.operatingProfit, rev35: r.pnl[2035].totals.revenue,
      irr: r.results.projectIRRPercent, npv8: r.results.NPV8_BJPY, payback: r.results.nominalPaybackYear,
      achieved: r.results.achievedBy2035, capex: r.results.totalCapex, rows: r.cashFlow };
  };
  const fmtPct = (p) => (p === null || p === undefined || !isFinite(p) ? '—' : (p < 0 ? '−' : '') + Math.abs(p).toFixed(1));
  const fmtVal = (x) => (Math.abs(x) >= 1000 ? x.toLocaleString(locale(), { maximumFractionDigits: 2 }) : String(Math.round(x * 10000) / 10000));

  // Every index the calculation actually reads (same method as financeView.usedInputs).
  const USED = (() => {
    const seen = new Set();
    const v = (id) => { if (!M.has(id)) throw new Error('Missing Federation index: ' + id); seen.add(id); return M.get(id); };
    const p30 = E.pnlYear(v, 2030), p35 = E.pnlYear(v, 2035); E.cashFlow(v, p30, p35);
    return [...seen].sort();
  })();
  const LABEL = (id) => (REC.get(id) || {}).label || id;
  const UNIT = (id) => (REC.get(id) || {}).unit || '';

  // ---------- KPI strip ----------
  function renderKpis(cur) {
    const changed = Object.keys(state.ov).length > 0;
    const d = (a, b, f, unit) => {
      if (!changed || a === null || b === null) return '';
      const x = a - b; if (Math.abs(x) < 1e-9) return '<span class="muted">±0</span>';
      return `<span class="${x > 0 ? 'pos' : 'neg'}">${x > 0 ? '+' : '−'}${f(Math.abs(x))}${unit} ${t('vsPlan')}</span>`;
    };

      `<div class="kpi"><div class="label">${label}</div><div class="value ${negative ? 'neg' : ''}">${value}<small>${unit}</small></div><div class="delta">${delta}</div></div>`;
    const u = t('unit'), mu = lang === 'ja' ? u : ' ' + u;
    const payTxt = (y) => (y ? String(y) : t('after2045'));
    $('kpis').innerHTML = [
      tile(t('k30'), fmtMoney(cur.op30), u, d(cur.op30, BASE.op30, fmtMoney, mu), cur.op30 < 0),
      tile(t('k35'), fmtMoney(cur.op35), u, d(cur.op35, BASE.op35, fmtMoney, mu), cur.op35 < 0),
      tile(t('kIrr'), fmtPct(cur.irr), '%', d(cur.irr, BASE.irr, (x) => x.toFixed(1), 'pt'), cur.irr !== null && cur.irr < 0),
      tile(t('kNpv'), fmtMoney(cur.npv8), u, d(cur.npv8, BASE.npv8, fmtMoney, mu), cur.npv8 < 0),
      tile(t('kPay'), payTxt(cur.payback), cur.payback ? t('yearUnit') : '',

    ].join('');
  }

  // ---------- Tornado ----------
  let tornadoCache = null;
  function computeTornado() {
    const base = quick(state.ov);
    const pick = (r) => (state.metric === 'op35' ? r.op35 : r.npv8);
    const b = pick(base);
    const rows = [];
    for (const id of LEVERS) {
      const v0 = Object.prototype.hasOwnProperty.call(state.ov, id) ? state.ov[id] : M.get(id);
      const lo = v0 * (1 - state.swing), hi = v0 * (1 + state.swing);
      let dLo, dHi;
      try { dLo = pick(quick({ ...state.ov, [id]: lo })) - b; dHi = pick(quick({ ...state.ov, [id]: hi })) - b; } catch { continue; }
      if (!isFinite(dLo) || !isFinite(dHi)) continue;
      const span = Math.max(Math.abs(dLo), Math.abs(dHi));
      if (span < 1e-6) continue;
      rows.push({ id, lo, hi, dLo, dHi, span });
    }
    rows.sort((a, c) => c.span - a.span);
    return { rows, base: b };
  }
  function renderTornado(recompute = true) {
    if (recompute || !tornadoCache) tornadoCache = computeTornado();
    const top = tornadoCache.rows.slice(0, 14);
    const max = Math.max(...top.map((r) => r.span), 1e-9);
    const pos = (x) => 50 + (x / max) * 36; // leaves room for the value labels at both ends
    const u = t('unit');
    const bar = (d, cls, val, id) => {
      const a = pos(0), z = pos(d);
      const left = Math.min(a, z), width = Math.max(Math.abs(z - a), 0.6);
      const labelSide = d < 0 ? `right:calc(100% + 4px)` : `left:calc(100% + 4px)`;
      return `<button type="button" class="tbar ${cls}" style="left:${left}%;width:${width}%" data-id="${esc(id)}" data-val="${val}" aria-label="${esc(t('setTo', { label: LABEL(id), v: fmtVal(val), d: sgn(d), u: lang === 'ja' ? u : ' ' + u }))}"><span style="${labelSide}">${sgn(d)}</span></button>`;
    };
    $('tornado').innerHTML = top.length ? top.map((r) =>
      `<div class="trow"><div class="name">${esc(LABEL(r.id))}<span class="id">${esc(r.id)}</span></div>` +
      `<div class="track"><div class="axis"></div>${bar(r.dLo, 'lo', r.lo, r.id)}${bar(r.dHi, 'hi', r.hi, r.id)}</div></div>`
    ).join('') : `<div class="empty">${esc(t('noLever'))}</div>`;
    $('t-note').textContent = t('tNote', { u, n: tornadoCache.rows.length, k: top.length });
  }

  // ---------- Cash flow chart ----------
  function renderChart(cur) {
    const rows = cur.rows, base = BASE.rows;
    const W = 640, H = 260, L = 56, R = 12, T = 14, B = 30;
    const vals = [...rows.map((r) => r.fcf), ...base.map((r) => r.fcf), ...rows.map((r) => r.cumulativeFcf), 0].map(money);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
    const step = niceStep((hi - lo) / 5);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
    const bw = (W - L - R) / rows.length;
    const x = (i) => L + i * bw;
    const u = t('unit');
    let g = '';
    for (let tk = lo; tk <= hi + step / 2; tk += step) {
      g += `<line x1="${L}" x2="${W - R}" y1="${y(tk)}" y2="${y(tk)}" stroke="var(--line)" stroke-width="${Math.abs(tk) < step / 2 ? 1.4 : 1}"/>`;
      g += `<text x="${L - 6}" y="${y(tk) + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${Math.round(tk).toLocaleString(locale())}</text>`;
    }
    rows.forEach((r, i) => {
      const bf = money(base[i].fcf), sf = money(r.fcf);
      g += `<rect x="${x(i) + bw * 0.14}" width="${bw * 0.3}" y="${Math.min(y(0), y(bf))}" height="${Math.max(Math.abs(y(bf) - y(0)), 0.5)}" fill="var(--bar-base)"><title>${esc(t('planFcf', { y: r.year, v: fmtMoney(base[i].fcf), u }))}</title></rect>`;
      g += `<rect x="${x(i) + bw * 0.48}" width="${bw * 0.36}" y="${Math.min(y(0), y(sf))}" height="${Math.max(Math.abs(y(sf) - y(0)), 0.5)}" fill="var(--accent)"><title>${esc(t('scnFcf', { y: r.year, v: fmtMoney(r.fcf), u }))}</title></rect>`;
      g += `<text x="${x(i) + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${r.year}</text>`;
    });
    const pts = rows.map((r, i) => `${x(i) + bw / 2},${y(money(r.cumulativeFcf))}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="var(--warn)" stroke-width="2"/>`;
    const last = rows.at(-1);
    g += `<circle cx="${x(rows.length - 1) + bw / 2}" cy="${y(money(last.cumulativeFcf))}" r="3.5" fill="var(--warn)"/>`;
    g += `<text x="${L}" y="10" font-size="10" fill="var(--muted)">${esc(u)}</text>`;
    $('chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('cfAria'))}">${g}</svg>`;
    $('cf-note').textContent = t('cfNote', { v: fmtMoney(last.cumulativeFcf), p: fmtMoney(BASE.rows.at(-1).cumulativeFcf), u });
  }
  function niceStep(raw) { const p = 10 ** Math.floor(Math.log10(raw)); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

  // ---------- Scenario editor ----------
  function renderOverrides() {
    const ids = Object.keys(state.ov);
    $('ovs').innerHTML = ids.length ? ids.map((id) =>
      `<div class="ov"><div class="lbl">${esc(LABEL(id))}<span class="tag">${esc(t('tag'))}</span><span class="sub">${esc(id)} · ${esc(t('planVal'))} ${fmtVal(M.get(id))} ${esc(UNIT(id))}</span></div>` +
      `<input type="number" step="any" id="ov-${esc(id)}" data-id="${esc(id)}" value="${state.ov[id]}" aria-label="${esc(LABEL(id))}">` +
      `<button type="button" class="x" data-del="${esc(id)}" aria-label="${esc(t('resetOne', { label: LABEL(id) }))}">×</button></div>`
    ).join('') : `<div class="empty">${esc(t('emptyOv'))}</div>`;
  }
  function setOverride(id, val) {
    if (!M.has(id) || !isFinite(val)) return;
    if (Math.abs(val - M.get(id)) < 1e-12) delete state.ov[id]; else state.ov[id] = val;

  let pending = null;
  function refresh(rebuildEditor) {
    let cur;

    current = cur;

  }
  function renderStaticText() {

    $('meta').innerHTML = esc(t('meta', { e: '\u0000e', b: '\u0000b', n: USED.length }))
      .replace('\u0000e', `<span class="num">${esc(E.PROJECT_FINANCE_ENGINE_VERSION)}</span>`)

  $('ovs').addEventListener('change', (e) => { const i = e.target.closest('input[data-id]'); if (i) setOverride(i.dataset.id, Number(i.value)); });
  $('ovs').addEventListener('click', (e) => { const b = e.target.closest('[data-del]'); if (b) { delete state.ov[b.dataset.del]; refresh(true); } });
  $('reset').addEventListener('click', () => { state.ov = {}; refresh(true); });
  $('add-list').innerHTML = LEVERS.map((id) => `<option value="${esc(id)}">${esc(LABEL(id))}</option>`).join('');
  const addFromInput = () => {
    const q = $('add-input').value.trim(); if (!q) return;
    const id = M.has(q) ? q : LEVERS.find((x) => LABEL(x).toLowerCase() === q.toLowerCase()) || LEVERS.find((x) => (x + ' ' + LABEL(x)).toLowerCase().includes(q.toLowerCase()));
    if (!id) { $('add-input').setCustomValidity(t('noMatch')); $('add-input').reportValidity(); return; }
    $('add-input').setCustomValidity(''); $('add-input').value = '';
    if (!(id in state.ov)) { state.ov[id] = M.get(id); renderOverrides(); }
    const el = document.getElementById('ov-' + id); if (el) el.focus();
  };
  $('add-btn').addEventListener('click', addFromInput);
  $('add-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addFromInput(); } });

  const setSeg = (a, b, on) => { $(a).setAttribute('aria-pressed', String(on)); $(b).setAttribute('aria-pressed', String(!on)); };
  $('m-op35').addEventListener('click', () => { state.metric = 'op35'; setSeg('m-op35', 'm-npv', true); renderTornado(); });
  $('m-npv').addEventListener('click', () => { state.metric = 'npv'; setSeg('m-op35', 'm-npv', false); renderTornado(); });
  $('s-10').addEventListener('click', () => { state.swing = 0.1; setSeg('s-10', 's-20', true); renderTornado(); });
  $('s-20').addEventListener('click', () => { state.swing = 0.2; setSeg('s-10', 's-20', false); renderTornado(); });

  const langHooks = [];
  function setLang(next) {
    if (next === lang) return;
    lang = next;
    try { localStorage.setItem('finance-lab-lang', lang); } catch {}
    renderStaticText(); renderKpis(current); renderChart(current); renderOverrides(); renderTornado(false);
    langHooks.forEach((f) => f());
  }
  $('lang-ja').addEventListener('click', () => setLang('ja'));
  $('lang-en').addEventListener('click', () => setLang('en'));
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (h === 'ja' || h === 'en') setLang(h); });

  try { const saved = JSON.parse(localStorage.getItem('finance-lab-ov') || '{}'); for (const [k, v] of Object.entries(saved)) if (M.has(k) && isFinite(v)) state.ov[k] = v; } catch {}
  renderStaticText();
  refresh(true);

  if (!PUBLIC_BUILD) {
  // ---------- Ask Claude (sample capability) ----------
  const history = []; // {role, content}
  let lastToolScenario = null;
  let sample = null, sampleChecked = false, busy = false, abort = null;
  const renderChips = () => { $('chips').innerHTML = t('suggest').map((s) => `<button type="button" class="chip">${esc(s)}</button>`).join(''); };
  const renderAskLead = () => { $('ask-lead').textContent = sampleChecked && !sample ? t('askLeadOff') : t('askLead'); };
  renderChips(); renderAskLead();
  langHooks.push(renderChips, renderAskLead);
  $('chips').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (c) { $('ask-input').value = c.textContent; ask(); } });

  const r1 = (x) => Math.round(x * 100) / 100;
  const summary = (r) => ({
    operatingProfit2030_bjpy: r1(r.op30), operatingProfit2030_oku: r1(r.op30 * 10),
    operatingProfit2035_bjpy: r1(r.op35), operatingProfit2035_oku: r1(r.op35 * 10),
    projectIRR_percent: r.irr === null ? null : Math.round(r.irr * 10) / 10,
    npv8_bjpy: r1(r.npv8), npv8_oku: r1(r.npv8 * 10),
    paybackYear: r.payback || 'after 2045', totalCapex_bjpy: r1(r.capex), totalCapex_oku: r1(r.capex * 10),
  });
  const TOOLS = [
    { name: 'find_inputs', description: 'Search the Federation indices that the project-finance calculation reads. Returns id, label, plan value, unit and year. Use before changing a value.',
      inputSchema: { type: 'object', properties: { query: { type: 'string', description: 'words from the label or id, e.g. "hpc price" or "fare"' } }, required: ['query'] },
      execute: ({ query }) => {
        const words = String(query || '').toLowerCase().split(/\s+/).filter(Boolean);
        return LEVERS.filter((id) => words.every((w) => (id + ' ' + LABEL(id)).toLowerCase().includes(w))).slice(0, 25)
          .map((id) => ({ id, label: LABEL(id), planValue: M.get(id), unit: UNIT(id), year: (REC.get(id) || {}).year || '' }));
      } },
    { name: 'run_scenario', description: 'Run the real project-finance engine with some indices replaced. Values are in each index\'s own unit. The page\'s current scenario is NOT included unless you pass it. Returns results in B JPY (*_bjpy), 億円 (*_oku) and percent.',
      inputSchema: { type: 'object', properties: { overrides: { type: 'object', description: 'map of index id to number', additionalProperties: { type: 'number' } } }, required: ['overrides'] },
      execute: ({ overrides }) => {
        const ov = {}, unknown = [];
        for (const [k, v] of Object.entries(overrides || {})) { if (M.has(k) && isFinite(Number(v))) ov[k] = Number(v); else unknown.push(k); }
        const r = full(ov); lastToolScenario = ov;
        return { applied: ov, unknownIds: unknown, results: summary(r), plan: summary(BASE) };
      } },
    { name: 'top_drivers', description: 'Rank indices by how much a ±swing changes 2035 operating profit or NPV(8%), around the page\'s current scenario. Deltas in B JPY and 億円.',
      inputSchema: { type: 'object', properties: { metric: { type: 'string', enum: ['op35', 'npv'] }, swingPercent: { type: 'number' } } },
      execute: ({ metric = 'op35', swingPercent = 20 }) => {
        const keep = { metric: state.metric, swing: state.swing };
        state.metric = metric === 'npv' ? 'npv' : 'op35'; state.swing = Math.min(Math.max(Number(swingPercent) || 20, 1), 90) / 100;
        const tr = computeTornado(); Object.assign(state, keep);
        return tr.rows.slice(0, 10).map((r) => ({ id: r.id, label: LABEL(r.id), lowValue: r.lo, highValue: r.hi,
          deltaAtLow_bjpy: r1(r.dLo), deltaAtHigh_bjpy: r1(r.dHi), deltaAtLow_oku: r1(r.dLo * 10), deltaAtHigh_oku: r1(r.dHi * 10) }));
      } },
  ];

  function brief() {
    const cur = full(state.ov);
    return [...t('brief'),
      `${t('briefPlan')}: ${JSON.stringify(summary(BASE))}`,
      `${t('briefOv')}: ${JSON.stringify(state.ov)}`,
      `${t('briefCur')}: ${JSON.stringify(summary(cur))}`,
    ].join('\n');
  }

  function renderThread(liveText) {
    const items = history.map((m) => `<div class="msg ${m.role === 'user' ? 'user' : 'ai'}">${esc(m.content)}</div>`);
    if (liveText !== undefined) items.push(`<div class="msg ai">${esc(liveText || t('thinking'))}</div>`);
    $('thread').innerHTML = items.join('');
    const lastAi = $('thread').querySelector('.msg.ai:last-child');
    if (liveText === undefined && lastAi && lastToolScenario && Object.keys(lastToolScenario).length) {
      const act = document.createElement('div'); act.className = 'act';
      act.innerHTML = `<button type="button" class="btn ghost" id="apply-ai">${esc(t('applyAi', { n: Object.keys(lastToolScenario).length }))}</button>`;
      lastAi.appendChild(act);
      $('apply-ai').addEventListener('click', () => { state.ov = { ...lastToolScenario }; refresh(true); });
    }
    $('thread').scrollTop = $('thread').scrollHeight;
  }

  async function ask() {
    const q = $('ask-input').value.trim();
    if (!q || busy || !sample) return;
    busy = true; $('ask-go').disabled = true; $('ask-status').textContent = t('answering');
    lastToolScenario = null;
    history.push({ role: 'user', content: q }); $('ask-input').value = '';
    renderThread('');
    abort = new AbortController();
    // The model keeps no memory between calls: send the whole conversation, with the current brief on the latest question.
    const msgs = history.map((m) => ({ role: m.role, content: m.content }));
    msgs[msgs.length - 1] = { role: 'user', content: brief() + '\n\n' + t('question') + q };
    try {
      const res = await sample(msgs, { tools: TOOLS, modelTier: 'default', cache: false, signal: abort.signal, onText: ({ text }) => renderThread(text) });
      history.push({ role: 'assistant', content: res.text || t('empty') });
      $('ask-status').textContent = res.truncated ? t('truncated') : '';
    } catch (e) {
      const code = e && e.code;
      if (code === 'not_granted') { history.pop(); $('ask-status').textContent = t('notGranted'); }
      else if (code === 'rate_limited') { history.push({ role: 'assistant', content: t('busyMsg') }); $('ask-status').textContent = ''; }
      else { history.push({ role: 'assistant', content: (e && e.text) || t('failed') + (e && e.message ? ' (' + e.message + ')' : '') }); $('ask-status').textContent = ''; }
    } finally { busy = false; $('ask-go').disabled = false; renderThread(); }
  }
  $('ask-go').addEventListener('click', ask);
  $('ask-input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ask(); } });
  $('ask-clear').addEventListener('click', () => { if (abort) abort.abort(); history.length = 0; lastToolScenario = null; renderThread(); $('ask-status').textContent = ''; });
  $('ask-go').disabled = true; $('ask-status').textContent = t('connecting');

  // ---------- Saved scenarios (db capability) ----------
  let db = null, user = null, canDelete = false, savedDocs = [];
  function renderSaved() {
    if (!savedDocs.length) { $('saved').innerHTML = `<div class="empty">${esc(t('savedEmpty'))}</div>`; return; }
    const u = t('unit');
    const amt = (oku) => (oku === null || oku === undefined ? '—' : fmtMoney(Number(oku) / 10));
    $('saved').innerHTML = savedDocs.map((d) => {
      const x = d.data() || {}; const n = Object.keys(x.overrides || {}).length;
      return `<div class="srow"><div><div class="nm">${esc(x.name || t('noName'))}</div><div class="kv">${esc(t('savedRow', { op: amt(x.op35_oku), npv: amt(x.npv8_oku), irr: x.irr ?? '—', n, u }))}</div></div>` +
        `<div style="display:flex;gap:6px"><button type="button" class="btn ghost" data-load="${esc(d.id)}">${esc(t('load'))}</button>${canDelete ? `<button type="button" class="x" data-rm="${esc(d.id)}" aria-label="${esc(t('del'))}">×</button>` : ''}</div></div>`;
    }).join('');
  }
  renderSaved();
  langHooks.push(renderSaved);
  $('saved').addEventListener('click', async (e) => {
    const l = e.target.closest('[data-load]'); const r = e.target.closest('[data-rm]');
    if (l) { const d = savedDocs.find((x) => x.id === l.dataset.load); const x = d && d.data(); if (x) { state.ov = {}; for (const [k, v] of Object.entries(x.overrides || {})) if (M.has(k) && isFinite(v)) state.ov[k] = v; refresh(true); } }
    if (r && db) { try { await db.doc('scenarios/' + r.dataset.rm).delete(); } catch (err) { $('saved-status').textContent = t('delFail'); } }
  });
  $('save-btn').addEventListener('click', async () => {
    if (!db) return;
    const name = $('save-name').value.trim();
    if (!name) { $('save-name').focus(); $('saved-status').textContent = t('needName'); return; }
    const r = full(state.ov);
    $('save-btn').disabled = true;
    try {
      await db.collection('scenarios').add({ name: name.slice(0, 80), overrides: { ...state.ov }, op35_oku: Math.round(r.op35 * 100) / 10,
        npv8_oku: Math.round(r.npv8 * 100) / 10, irr: r.irr === null ? null : Math.round(r.irr * 10) / 10,
        baseline: BASELINE.version, engine: E.PROJECT_FINANCE_ENGINE_VERSION, by: user ? await user.id() : null, at: Date.now() });
      $('save-name').value = ''; $('saved-status').textContent = t('saved');
    } catch (err) { $('saved-status').textContent = err && err.code === 'permission_denied' ? t('noPerm') : t('saveFail'); }
    finally { $('save-btn').disabled = false; }
  });
  $('save-btn').disabled = true;

  (async () => {
    const c = window.claude;
    if (!c || !c.use) { $('ask-status').textContent = t('openInClaude'); $('saved-status').textContent = t('openInClaude'); return; }
    c.use('sample').then((s) => {
      sample = s; sampleChecked = true; renderAskLead();
      if (s) { $('ask-go').disabled = false; $('ask-status').textContent = ''; }
      else { $('ask-status').textContent = t('notHere'); }
    });
    user = await c.use('user');
    canDelete = user ? await user.canEdit() : false;
    db = await c.use('db');
    if (!db) { $('saved-status').textContent = t('signIn'); return; }
    $('save-btn').disabled = false;
    const timer = setTimeout(() => { $('saved-status').textContent = t('slow'); }, 10000);
    db.collection('scenarios').orderBy('at', 'desc').limit(30).onSnapshot((snap) => { clearTimeout(timer); $('saved-status').textContent = ''; savedDocs = snap.docs; renderSaved(); },
      () => { clearTimeout(timer); $('saved-status').textContent = t('readFail'); });
  })();
  }
})();
</script>

</body>
</html>
