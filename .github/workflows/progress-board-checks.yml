name: Progress board checks
on:
  pull_request:
    paths:
      - 'progress-board/**'
      - '.github/workflows/progress-board-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test existing progress board
        run: node --test progress-board/board.test.mjs
      - name: Validate worker manifest
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('progress-board/chat-workers.json','utf8')); if(!Array.isArray(d.workers)) process.exit(1); if(new Set(d.workers.map(x=>x.id)).size!==d.workers.length) process.exit(1); for(const t of ['python','codex','claude','gemini']) if(!d.additional_executors.some(x=>x.executor_type===t)) process.exit(1);"
