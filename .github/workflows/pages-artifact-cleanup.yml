name: Reclaim completed Pages deployment archives
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
permissions:
  contents: write
  actions: write
concurrency:
  group: pages-artifact-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify preserved evidence before deleting legacy artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import json, subprocess, os, pathlib, hashlib, zipfile, tempfile
          repo=os.environ["GH_REPO"]
          base="repos/"+repo
          def api(path,*args):
              return subprocess.check_output(["gh","api",path,*args])
          def data(path):
              return json.loads(api(path))
          tag="pages-evidence-20261016"
          baseline="artifact-11937300166.zip"
          expected="cb91ac233f0ba0e910f1dc278f559a837bc9ae094414791ce31921505bead664"
          release=data(base+"/releases/tags/"+tag)
          assets=data(base+"/releases/"+str(release["id"])+"/assets?per_page=100")
          retained=next(a for a in assets if a["name"]==baseline)
          payload=api(base+"/releases/assets/"+str(retained["id"]),"-H","Accept: application/octet-stream")
          if hashlib.sha256(payload).hexdigest()!=expected: raise RuntimeError("Oldest evidence digest mismatch")
          with tempfile.TemporaryDirectory() as temp:
              path=pathlib.Path(temp)/baseline
              path.write_bytes(payload)
              with zipfile.ZipFile(path) as archive:
                  if archive.testzip() is not None: raise RuntimeError("Invalid oldest evidence ZIP")
              manifest={"policy":"Retain only the oldest historical PDF/deployment evidence; current published PDFs remain in main.","asset":baseline,"sha256":expected,"size_in_bytes":len(payload),"original_artifact_id":11937300166}
              manifest_path=pathlib.Path(temp)/"manifest.json"
              manifest_path.write_text(json.dumps(manifest,indent=2))
              subprocess.run(["gh","release","upload",tag,str(manifest_path),"--clobber"],check=True)
          removed_assets=0
          removed_bytes=0
          for asset in assets:
              if asset["name"].startswith("artifact-") and asset["name"].endswith(".zip") and asset["name"]!=baseline:
                  api(base+"/releases/assets/"+str(asset["id"]),"--method","DELETE")
                  removed_assets+=1
                  removed_bytes+=asset["size"]
          artifacts=[]
          page=1
          while True:
              batch=data(base+"/actions/artifacts?per_page=100&page="+str(page))["artifacts"]
              artifacts.extend(a for a in batch if not a["expired"] and a["name"]=="github-pages")
              if len(batch)<100: break
              page+=1
          deleted=0
          reclaimed=0
          for a in artifacts:
              run=data(base+"/actions/runs/"+str(a["workflow_run"]["id"]))
              if run["status"]!="completed": continue
              api(base+"/actions/artifacts/"+str(a["id"]),"--method","DELETE")
              deleted+=1
              reclaimed+=a["size_in_bytes"]
          summary=f"Verified oldest evidence; deleted {removed_assets} later evidence archives ({removed_bytes} bytes); deleted {deleted} completed Pages artifacts ({reclaimed} bytes)."
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out: out.write(summary+"\n")
