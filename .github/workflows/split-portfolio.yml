name: Split portfolio PDF

on:
  push:
    paths:
      - '.github/workflows/split-portfolio.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Split portfolio and update page
        shell: bash
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter

          src = Path("Satofumi Goto_Portforio_20260824.pdf")
          out1 = Path("portfolio/Autonomous_Mobility_Business_Model_Design.pdf")
          out2 = Path("portfolio/Autonomous_Mobility_System_Business_Feasibility.pdf")

          reader = PdfReader(str(src))
          n = len(reader.pages)
          if n < 12:
              raise SystemExit(f"Source PDF has only {n} pages; expected at least 12.")

          w1 = PdfWriter()
          for i in range(0, 11):
              w1.add_page(reader.pages[i])
          with out1.open("wb") as f:
              w1.write(f)

          w2 = PdfWriter()
          for i in range(11, n):
              w2.add_page(reader.pages[i])
          with out2.open("wb") as f:
              w2.write(f)

          old = Path("portfolio/Satofumi Goto_Portforio_20260826.pdf")
          if old.exists():
              old.unlink()

          html = """<!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>後藤 悟文｜自動運転事業開発ポートフォリオ</title>
          </head>
          <body>

          <h1>後藤 悟文</h1>
          <h2>自動運転事業開発ポートフォリオ</h2>

          <p>
          自動運転の事業開発・プロダクト企画・事業システム設計
          </p>

          <h3>試作アプリケーション</h3>
          <ul>
            <li><a href="https://seneschal.base44.app" target="_blank" rel="noopener noreferrer">Seneschal</a></li>
            <li><a href="https://federation.base44.app/" target="_blank" rel="noopener noreferrer">Federation</a></li>
          </ul>

          <h3>ポートフォリオ</h3>
          <ul>
            <li><a href="portfolio/Autonomous_Mobility_Business_Model_Design.pdf" target="_blank" rel="noopener noreferrer">自動運転サービスのビジネスモデル設計</a></li>
            <li><a href="portfolio/Autonomous_Mobility_System_Business_Feasibility.pdf" target="_blank" rel="noopener noreferrer">自動運転事業のシステム・事業性検証</a></li>
          </ul>

          <h3>本資料について</h3>
          <p>
          本ポートフォリオは、自動運転の事業化に向けて、需要・車両群の運用・車両・エネルギー・インフラを一体で捉え、独自に検討した事業構想と試作アプリケーションをまとめたものです。
          </p>
          <p>
          掲載資料は公開情報と自主検討に基づいて作成しており、現職・過去在籍企業の機密情報や独自の知的財産を含みません。
          </p>

          </body>
          </html>
          """
          Path("index.html").write_text(html, encoding="utf-8")
          print(f"Split {n} pages into 11 pages + {n-11} pages")
          PY

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Split portfolio into two PDFs"
          git push
