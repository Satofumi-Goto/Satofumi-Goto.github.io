name: Portfolio TIER IV Autoware document alignment
on:
  push:
    branches:
      - portfolio/tieriv-spec-20261026
    paths:
      - portfolio/tieriv-run.json
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF editing dependency
        run: python -m pip install --quiet pymupdf
      - name: Apply precise in-page changes to three portfolio PDF editions
        run: python portfolio/_tieriv_editor_20261026.py
      - name: Commit outputs and local verification evidence on draft branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/documents portfolio/_tieriv_verification.json portfolio/_tieriv_review_*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "portfolio: TIER IV Autoware in-page PDFs verified"
          git push
