name: Portfolio PDF in-place wording repair
on:
  push:
    branches:
      - portfolio/inplace-pdf-wording-20261025
    paths:
      - .github/workflows/portfolio-pdf-inplace-20261025.yml
      - portfolio/inplace-plan.json
      - portfolio/_inplace_pdf_editor.py
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pymupdf
      - name: Audit text or update portfolio-only PDF bodies
        shell: bash
        run: |
          if [ -f portfolio/inplace-plan.json ]; then
            python portfolio/_inplace_pdf_editor.py apply
          else
            python portfolio/_inplace_pdf_editor.py audit
          fi
      - name: Commit only generated PDF and verification files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A portfolio/_inplace_pdf_audit.json portfolio/documents; if [ -f portfolio/_inplace_pdf_verification.json ]; then git add portfolio/_inplace_pdf_verification.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "portfolio in-place PDF wording verified"
          git push
